name: Publish container image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate startup and model configuration
        run: |
          bash -n start.sh
          python3 -B -m unittest discover -s tests -v
          python3 download_models.py --manifest models.json --validate-only

      - name: Free unused runner SDK space for the ML image
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for startup validation
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          target: curated
          load: true
          push: false
          tags: cfy:check
          labels: |
            org.opencontainers.image.source=https://github.com/p355planes/cfy

      - name: Test actual image startup before publishing
        env:
          SMOKE_IMAGE: cfy:check
        run: python3 tests/smoke_container.py

      - name: Publish tested image
        env:
          IMAGE: ghcr.io/p355planes/cfy
        run: |
          docker tag cfy:check "$IMAGE:$GITHUB_SHA"
          docker tag cfy:check "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
