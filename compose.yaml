services:
  comfyui:
    build:
      context: .
      target: vanilla
    image: comfyui-revamp:0.43.0-vanilla
    gpus: all
    ports:
      - "127.0.0.1:8188:8188"
      - "127.0.0.1:8888:8888"
    volumes:
      - comfyui-workspace:/workspace
      - ./models.json:/opt/template/models.json:ro
      - ./workflows:/opt/template/workflows:ro
    environment:
      ENABLE_JUPYTER: "1"
      HF_TOKEN: "${HF_TOKEN:-}"
    stop_grace_period: 30s
volumes:
  comfyui-workspace:
